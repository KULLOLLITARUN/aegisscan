# Keeps the SHA-pinned Actions, the Python packages and the UI packages current.
# Each ecosystem's updates are grouped into one weekly pull request, so at most three
# arrive per week (instead of one per package).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-dependencies:
        patterns: ["*"]
