name: AegisScan Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege: every job only reads the repository. (upload-artifact uses the runner's own
# token, not GITHUB_TOKEN, so it needs no extra permission.)
permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # only to upload the SARIF report to code scanning
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[static,dev]"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install OSV-Scanner
        run: |
          # Dependency CVE scanning. Pinned version, checksum verified before it is put on PATH.
          OSV_VERSION=2.7.1
          OSV_SHA256=fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          rm osv-scanner
          osv-scanner --version

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1   # PyPA, Apache-2.0; pinned

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q -rfE --cov=scanner --cov-report=term-missing --cov-fail-under=75 2>&1 | tee pytest.log

      - name: Show failed tests as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest.log | cut -c1-400 | while IFS= read -r line; do echo "::error::$line"; done || true
          grep -E "^(TOTAL|FAIL Required)" pytest.log | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Run AegisScan Security Audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A CI checkout is clean, so plain --changed-only would see no changes and scan nothing.
          # Compare with what this run adds instead: the pull request's base branch, or the commit
          # the branch pointed at before this push.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="$BEFORE_SHA"
          fi
          # A new branch or a force push has no usable "before" commit; fall back to the parent
          # commit (and if that does not exist either, main.py scans everything).
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            BASE="HEAD~1"
          fi
          echo "Scanning files changed since $BASE"
          # Static-only on purpose: CI never sends a pull request's code to an LLM provider.
          echo "AUDIT_BASE=$BASE" >> "$GITHUB_ENV"
          # Keep the console output for the summary below, outside the checkout so it is not itself scanned
          # as a changed file; pipefail keeps the gate's exit code (2).
          set -o pipefail
          python main.py . --changed-since "$BASE" --static-only --fail-on security:high --html aegisscan-report.html --sarif aegisscan.sarif --privacy redact 2>&1 | tee "$RUNNER_TEMP/audit.log"

      - name: Audit summary
        if: always()
        run: |
          # Shown on the run's summary page, so what the audit scanned is visible without opening logs.
          {
            echo "### AegisScan audit"
            echo
            if [ ! -f "$RUNNER_TEMP/audit.log" ]; then
              echo "The audit step did not produce output (it failed before scanning)."
            else
              echo "- Compared with: \`${AUDIT_BASE:-unknown}\`"
              if grep -q "scanning everything instead" "$RUNNER_TEMP/audit.log"; then
                echo "- **That ref was not found, so the whole tree was scanned.**"
              fi
              echo "- Files analysed: $(awk '/^ *Analyzable/ {print $NF; exit}' "$RUNNER_TEMP/audit.log")"
              echo "- $(grep -m1 'FINDINGS' "$RUNNER_TEMP/audit.log" | sed 's/^ *//')"
              echo "- $(grep -m1 '\[CI GATE\]' "$RUNNER_TEMP/audit.log" | sed 's/^ *//')"
              if grep -q '^  SEV ' "$RUNNER_TEMP/audit.log"; then
                echo
                echo "~~~"
                sed -n '/^  SEV /,/^  V4 complete/p' "$RUNNER_TEMP/audit.log" | grep -v '^  V4 complete' | tr -d '`' | head -30
                echo "~~~"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Python dependency audit (pip-audit)
        # Cross-checks the installed Python packages against the PyPI advisory database.
        # Informational: a new advisory should not block unrelated work.
        continue-on-error: true
        run: pip-audit --progress-spinner off --desc off

      - name: Upload SARIF to code scanning
        # Not on pull requests: those from forks get a read-only token.
        if: always() && github.event_name == 'push' && hashFiles('aegisscan.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: aegisscan.sarif
          category: aegisscan

      - name: Upload HTML Security Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegisscan-report
          path: |
            aegisscan-report.html
            aegisscan.sarif

  ui-build:
    # The React build output (scanner/server/dist) is not committed. Build it here so a broken
    # UI is caught on every push, and publish it for anyone who wants the ready-made bundle.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Lint UI
        run: npm run lint
      - name: Test UI logic
        run: npm test

      - name: Build UI
        run: npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegisscan-ui-dist
          path: scanner/server/dist
