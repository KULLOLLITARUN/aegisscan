name: AegisScan Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[static,dev]"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q --cov=scanner --cov-report=term-missing --cov-fail-under=75

      - name: Run AegisScan Security Audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py . --changed-only --fail-on security:high --html aegisscan-report.html --privacy redact

      - name: Upload HTML Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegisscan-report
          path: aegisscan-report.html

  ui-build:
    # The React build output (scanner/server/dist) is not committed. Build it here so a broken
    # UI is caught on every push, and publish it for anyone who wants the ready-made bundle.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner/server/ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scanner/server/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Lint UI
        run: npm run lint

      - name: Build UI
        run: npm run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: aegisscan-ui-dist
          path: scanner/server/dist
