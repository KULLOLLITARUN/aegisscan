[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisscan"
version = "0.1.0"
description = "AI-driven workspace security & optimization scanner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pathspec>=0.12",
    # V1 — chunking
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-c-sharp>=0.23",
    # V1 — static analysis
    "bandit[toml]>=1.8",
    # V2 — LLM reasoning (Groq only per project constraint)
    "groq>=0.9",
    # auto-load .env file so GROQ_API_KEY doesn't need to be set in the shell
    "python-dotenv>=1.0",
]

[project.scripts]
aegisscan = "main:main"

[project.optional-dependencies]
# Semgrep is a pip package; Gitleaks is a standalone Go binary (install separately:
# https://github.com/gitleaks/gitleaks/releases). Both are optional at runtime.
static = [
    "semgrep>=1.60",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.setuptools.package-data]
"scanner.server" = ["templates/*.html", "dist/**/*"]
"scanner.static_analysis" = ["rules/*.yml"]
"scanner.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["scanner"]
omit = ["tests/*"]

[tool.coverage.report]
# measured 80% at introduction; ratchet upward, never down
fail_under = 75

[tool.mypy]
python_version = "3.11"
files = ["scanner", "main.py"]
exclude = ["scanner/server/dist"]
# tree-sitter grammars, semgrep etc. ship without stubs
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["examples", "ui", "scanner/server/dist"]

[tool.ruff.lint]
# Conservative baseline: real bugs and hygiene only. Widen deliberately, never by accident.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
# main.py must load .env before importing scanner modules, and uses compact one-line branches
"main.py" = ["E402", "E701"]
