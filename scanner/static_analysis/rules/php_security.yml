# AegisScan's own PHP rules. The registry PHP pack is not loaded (it added download time and no
# measured gain), so the high-signal superglobal sinks are covered here.
rules:
  - id: aegis-php-include-request
    languages: [php]
    severity: ERROR
    message: "include/require of a path built from request data allows local/remote file inclusion; use an allow-list"
    metadata: {aegis_category: path_traversal, aegis_confidence: "0.90"}
    pattern-either:
      - pattern: include(<... $_GET[...] ...>)
      - pattern: include(<... $_POST[...] ...>)
      - pattern: include(<... $_REQUEST[...] ...>)
      - pattern: include(<... $_COOKIE[...] ...>)
      - pattern: include_once(<... $_GET[...] ...>)
      - pattern: include_once(<... $_POST[...] ...>)
      - pattern: include_once(<... $_REQUEST[...] ...>)
      - pattern: require(<... $_GET[...] ...>)
      - pattern: require(<... $_POST[...] ...>)
      - pattern: require(<... $_REQUEST[...] ...>)
      - pattern: require_once(<... $_GET[...] ...>)
      - pattern: require_once(<... $_POST[...] ...>)
      - pattern: require_once(<... $_REQUEST[...] ...>)

  - id: aegis-php-unserialize-request
    languages: [php]
    severity: ERROR
    message: "unserialize() of request data allows object injection and code execution; use json_decode or allowed_classes"
    metadata: {aegis_category: deserialization, aegis_confidence: "0.90"}
    pattern-either:
      - pattern: unserialize(<... $_GET[...] ...>)
      - pattern: unserialize(<... $_POST[...] ...>)
      - pattern: unserialize(<... $_REQUEST[...] ...>)
      - pattern: unserialize(<... $_COOKIE[...] ...>)

  - id: aegis-php-eval-nonliteral
    languages: [php]
    severity: ERROR
    message: "eval() of a non-literal value allows arbitrary code execution"
    metadata: {aegis_category: injection, aegis_confidence: "0.85"}
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")

  - id: aegis-php-extract-request
    languages: [php]
    severity: ERROR
    message: "extract() of request data lets callers overwrite any variable (variable injection)"
    metadata: {aegis_category: injection, aegis_confidence: "0.90"}
    pattern-either:
      - pattern: extract($_GET, ...)
      - pattern: extract($_POST, ...)
      - pattern: extract($_REQUEST, ...)
      - pattern: extract($_COOKIE, ...)

  - id: aegis-php-weak-password-hash
    languages: [php]
    severity: WARNING
    message: "md5()/sha1() of a password is fast to brute force and unsalted; use password_hash()"
    metadata: {aegis_category: crypto, aegis_confidence: "0.80"}
    patterns:
      - pattern-either:
          - pattern: md5($X, ...)
          - pattern: sha1($X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(passw|pwd|passphrase).*

  - id: aegis-php-open-redirect-request
    languages: [php]
    severity: WARNING
    message: "Redirecting to a request value allows open redirects; validate against an allow-list"
    metadata: {aegis_category: redirect, aegis_confidence: "0.80"}
    pattern-either:
      - pattern: 'header("Location: " . <... $_GET[...] ...>)'
      - pattern: 'header("Location: " . <... $_POST[...] ...>)'
      - pattern: 'header("Location: " . <... $_REQUEST[...] ...>)'

  - id: aegis-php-path-traversal-request
    languages: [php]
    severity: WARNING
    message: "A request value reaches a filesystem path without a containment check (path traversal)"
    metadata: {aegis_category: path_traversal, aegis_confidence: "0.80"}
    patterns:
      - pattern-either:
          - pattern: $FN(<... $_GET[...] ...>, ...)
          - pattern: $FN(<... $_POST[...] ...>, ...)
          - pattern: $FN(<... $_REQUEST[...] ...>, ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^(file_get_contents|file_put_contents|readfile|fopen|file|unlink|copy|rename|mkdir|rmdir|touch|is_file|file_exists|highlight_file|show_source)$
      # a basename()/realpath() wrapper around the request value is the usual guard
      - pattern-not: $FN(<... basename(<... $_GET[...] ...>) ...>, ...)
      - pattern-not: $FN(<... basename(<... $_POST[...] ...>) ...>, ...)
      - pattern-not: $FN(<... basename(<... $_REQUEST[...] ...>) ...>, ...)
      - pattern-not: $FN(<... realpath(<... $_GET[...] ...>) ...>, ...)
      - pattern-not: $FN(<... realpath(<... $_POST[...] ...>) ...>, ...)
      - pattern-not: $FN(<... realpath(<... $_REQUEST[...] ...>) ...>, ...)

  # ---------------------------------------------------------------------------------------------
  # Taint rules: a request value reaches a dangerous sink through a variable in the same file or
  # function (the direct-use rules above only see `include($_GET[...])` written in one expression).
  # Semgrep OSS follows the flow inside one file; it does not follow it across files or through
  # function calls, and it cannot see an allow-list check (`in_array($page, $allowed)`), so such
  # code is still reported. Casts and the usual escaping functions end the flow.
  # ---------------------------------------------------------------------------------------------
  - id: aegis-php-taint-file-inclusion
    languages: [php]
    severity: ERROR
    message: "A request value reaches include/require, allowing local or remote file inclusion; use an allow-list of pages"
    metadata: {aegis_category: path_traversal, aegis_confidence: "0.85"}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
    pattern-sanitizers:
      # a validation call on the variable ends the flow for the code after it (allow-lists, digits)
      - patterns:
          - pattern-either:
              - pattern: in_array($X, ...)
              - pattern: is_numeric($X)
              - pattern: ctype_digit($X)
              - pattern: ctype_alnum($X)
          - focus-metavariable: $X
        by-side-effect: true
      - pattern-either:
          - pattern: basename(...)
          - pattern: realpath(...)
          - pattern: intval(...)
          - pattern: (int) $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: include($X)
              - pattern: include_once($X)
              - pattern: require($X)
              - pattern: require_once($X)
          # include(<... $_GET[...] ...>) written in one expression is aegis-php-include-request's;
          # reporting it here too would show the same line twice
          - pattern-not-regex: '\$_(GET|POST|REQUEST|COOKIE)'

  - id: aegis-php-taint-xss
    languages: [php]
    severity: WARNING
    message: "A request value is echoed without escaping (reflected XSS); wrap it in htmlspecialchars()"
    metadata: {aegis_category: xss, aegis_confidence: "0.75"}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
    pattern-sanitizers:
      # a validation call on the variable ends the flow for the code after it (allow-lists, digits)
      - patterns:
          - pattern-either:
              - pattern: in_array($X, ...)
              - pattern: is_numeric($X)
              - pattern: ctype_digit($X)
              - pattern: ctype_alnum($X)
          - focus-metavariable: $X
        by-side-effect: true
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: strip_tags(...)
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: json_encode(...)
          - pattern: urlencode(...)
          - pattern: (int) $X
    pattern-sinks:
      - pattern-either:
          - pattern: echo $X;
          - pattern: print $X;
          - pattern: print($X);

  - id: aegis-php-taint-command-injection
    languages: [php]
    severity: ERROR
    message: "A request value reaches a shell command; use escapeshellarg() or avoid the shell"
    metadata: {aegis_category: injection, aegis_confidence: "0.85"}
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
    pattern-sanitizers:
      # a validation call on the variable ends the flow for the code after it (allow-lists, digits)
      - patterns:
          - pattern-either:
              - pattern: in_array($X, ...)
              - pattern: is_numeric($X)
              - pattern: ctype_digit($X)
              - pattern: ctype_alnum($X)
          - focus-metavariable: $X
        by-side-effect: true
      - pattern-either:
          - pattern: escapeshellarg(...)
          - pattern: escapeshellcmd(...)
          - pattern: intval(...)
          - pattern: (int) $X
    pattern-sinks:
      - pattern-either:
          - pattern: shell_exec($X)
          - pattern: exec($X, ...)
          - pattern: system($X, ...)
          - pattern: passthru($X, ...)
          - pattern: popen($X, ...)
          - pattern: proc_open($X, ...)
