<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AegisScan survey console</title>
    <meta name="description" content="AI-Driven Workspace Security & Optimization Scanner" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      (function () {
        // Night is the default; a choice saved by the Day / Night buttons wins, the system setting does not.
        var t = 'night';
        try {
          t = localStorage.getItem('aegis-theme3') || 'night';
        } catch (e) { /* storage unavailable: default to night */ }
        document.documentElement.setAttribute('data-theme', t === 'night' ? 'night' : 'day');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
